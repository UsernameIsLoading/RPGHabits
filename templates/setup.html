<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101321"><link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><title>Crie seu personagem — RPG de Hábitos</title></head>
<body class="login-body pixel-theme"><main class="setup-shell"><p class="eyebrow">PRIMEIRO ACESSO · ETAPA 1/1</p><h1>Escolha sua <span>classe</span></h1><p class="muted">Essa escolha define sua aparência e o atributo que recebe o dobro de XP. Ela não poderá ser trocada pela tela normal depois da confirmação.</p>
<form id="class-form"><div class="class-grid">{% for code, cls in classes.items() %}<label class="class-choice"><input type="radio" name="class_code" value="{{ code }}" {% if loop.first %}checked{% endif %}><img class="class-sprite-img" src="{{ cls.sprite_url }}" alt="Sprite da classe {{ cls.name }}"><strong>{{ cls.name }}</strong><small>Dominante: {{ cls.dominant }}</small><p>{{ cls.description }}</p><span class="class-bonus">XP ×2 em {{ cls.dominant }}</span></label>{% endfor %}</div><button class="primary full" type="submit">Confirmar personagem e entrar</button><p id="setup-error" class="error-text" aria-live="polite"></p></form></main><script>document.querySelector('#class-form').addEventListener('submit',async e=>{e.preventDefault();const code=new FormData(e.currentTarget).get('class_code');const err=document.querySelector('#setup-error');try{const r=await fetch('/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({class_code:code})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Não foi possível criar o personagem.');location.href='/';}catch(ex){err.textContent=ex.message;}});if('serviceWorker' in navigator)navigator.serviceWorker.register('/service-worker.js').catch(()=>{});</script></body></html>
